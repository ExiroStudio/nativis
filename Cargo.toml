[workspace]
resolver = "2"
members = [
    "crates/nativis-core",
    "crates/nativis-asset",
    "crates/nativis-rhi",
    "crates/nativis-render",
    "crates/nativis-platform",
    "crates/nativis-plugin",
    "crates/nativis-runtime",
    "plugins/image_backend",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["Nativis Contributors"]

# ── Shared dependency versions ──────────────────────────────────────────────
[workspace.dependencies]
# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# Async
tokio = { version = "1", features = ["full"] }

# GPU
wgpu      = "22"
bytemuck  = { version = "1", features = ["derive"] }

# Windowing
winit              = "0.30"
raw-window-handle  = "0.6"

# Image
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Wayland / X11
smithay-client-toolkit = "0.19"
wayland-client         = "0.31"
wayland-protocols-wlr  = { version = "0.3", features = ["client"] }
x11rb                  = "0.13"

# Concurrency
parking_lot        = "0.12"
crossbeam-channel  = "0.5"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
bitflags = "2"
pollster = "0.3"

# ── Internal crates ──────────────────────────────────────────────────────────
nativis-core     = { path = "crates/nativis-core" }
nativis-asset    = { path = "crates/nativis-asset" }
nativis-rhi      = { path = "crates/nativis-rhi" }
nativis-render   = { path = "crates/nativis-render" }
nativis-platform = { path = "crates/nativis-platform" }
nativis-plugin   = { path = "crates/nativis-plugin" }
nativis-runtime      = { path = "crates/nativis-runtime" }
nativis-plugin-image = { path = "plugins/image_backend" }

# ── Binary ───────────────────────────────────────────────────────────────────
[package]
name    = "nativis"
version.workspace = true
edition.workspace = true

[dependencies]
nativis-runtime      = { workspace = true }
nativis-plugin       = { workspace = true }
nativis-plugin-image = { workspace = true }
tracing-subscriber   = { workspace = true }
tracing              = { workspace = true }
anyhow               = { workspace = true }


