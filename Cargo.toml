[workspace]
resolver = "2"
members = [
    "crates/nativis-core",
    "crates/nativis-event",
    "crates/nativis-rhi",
    "crates/nativis-render-graph",
    "crates/nativis-asset",
    "crates/nativis-media",
    "crates/nativis-ecs",
    "crates/nativis-scene",
    "crates/nativis-timeline",
    "crates/nativis-audio",
    "crates/nativis-platform",
    "crates/nativis-plugin",
    "crates/nativis-engine",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["Nativis Contributors"]

# ── Shared dependency versions ──────────────────────────────────────────────
[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# Async
tokio = { version = "1", features = ["full"] }

# GPU
wgpu      = "22"
bytemuck  = { version = "1", features = ["derive"] }

# Windowing
winit              = "0.30"
raw-window-handle  = "0.6"

# Image
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Wayland
smithay-client-toolkit = "0.19"
wayland-client         = "0.31"
wayland-protocols-wlr  = { version = "0.3", features = ["client"] }

# Audio
cpal = "0.15"

# Concurrency
parking_lot        = "0.12"
crossbeam-channel  = "0.5"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Internal crates ──────────────────────────────────────────────────────────
nativis-core         = { path = "crates/nativis-core" }
nativis-event        = { path = "crates/nativis-event" }
nativis-rhi          = { path = "crates/nativis-rhi" }
nativis-render-graph = { path = "crates/nativis-render-graph" }
nativis-asset        = { path = "crates/nativis-asset" }
nativis-media        = { path = "crates/nativis-media" }
nativis-ecs          = { path = "crates/nativis-ecs" }
nativis-scene        = { path = "crates/nativis-scene" }
nativis-timeline     = { path = "crates/nativis-timeline" }
nativis-audio        = { path = "crates/nativis-audio" }
nativis-platform     = { path = "crates/nativis-platform" }
nativis-plugin       = { path = "crates/nativis-plugin" }
nativis-engine       = { path = "crates/nativis-engine" }

# ── Binary ───────────────────────────────────────────────────────────────────
[package]
name    = "nativis"
version.workspace = true
edition.workspace = true

[dependencies]
nativis-engine     = { workspace = true }
tracing-subscriber = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }
