[workspace]
resolver = "2"
members = [
    # Engine Core
    "nativis-core/core",
    "nativis-core/asset",
    "nativis-core/media",
    "nativis-core/plugin",
    "nativis-core/protocol",
    "nativis-core/render",
    "nativis-core/rhi",
    "nativis-core/transport-shm",
    "nativis-core/runtime",
    "nativis-core/event",

    # Plugins
    "plugins/image_backend",
    "plugins/video_backend",

    # Platform (KDE Plasma X11)
    "nativis-platform/kde-x11/plasma-plugin", "nativis-platform/kde-x11/platform", "xtask",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["Nativis Contributors"]

# ── Shared dependency versions ──────────────────────────────────────────────
[workspace.dependencies]
# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"
anyhow    = "1"

# GPU (Kept for Engine RHI)
wgpu      = "22"
bytemuck  = { version = "1", features = ["derive"] }

# Windowing (Kept for Engine RHI)
winit              = "0.30"
raw-window-handle  = "0.6"

# Image (Kept for Engine Media/Asset)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
bitflags = "2"
pollster = "0.3"

# Concurrency
parking_lot        = "0.12"
crossbeam-channel  = "0.5"

# ── Internal crates ──────────────────────────────────────────────────────────
nativis-core     = { path = "nativis-core/core" }
nativis-asset    = { path = "nativis-core/asset" }
nativis-rhi      = { path = "nativis-core/rhi" }
nativis-render   = { path = "nativis-core/render" }
nativis-plugin   = { path = "nativis-core/plugin" }
nativis-runtime  = { path = "nativis-core/runtime" }
nativis-protocol = { path = "nativis-core/protocol" }
nativis-transport-shm = { path = "nativis-core/transport-shm" }
nativis-plugin-image = { path = "plugins/image_backend" }
nativis-plugin-video = { path = "plugins/video_backend" }
nativis-platform-kde = { path = "nativis-platform/kde-x11/platform" }

# ── Binary (nativis-cli placeholder) ─────────────────────────────────────────
[package]
name    = "nativis"
version.workspace = true
edition.workspace = true

[dependencies]
tracing-subscriber   = { workspace = true }
tracing              = { workspace = true }
anyhow               = { workspace = true }

nativis-core          = { workspace = true }
nativis-plugin        = { workspace = true }
nativis-runtime       = { workspace = true }
nativis-asset         = { workspace = true }
nativis-plugin-image  = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
nativis-plugin-video  = { workspace = true }
nativis-platform-kde  = { workspace = true }
nativis-transport-shm = { workspace = true }
