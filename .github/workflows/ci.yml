name: CI Matrix (Linux & Windows)

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-ci

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            nasm \
            clang \
            libclang-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswresample-dev

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Cargo Test Workspace
        run: cargo test --workspace

  check-windows:
    name: Check & Test (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-ci

      - name: Install FFmpeg Development Libraries (Windows MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Write-Host "Downloading FFmpeg from $url..."
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "C:\ffmpeg"
          $extractedDir = Get-ChildItem -Path "C:\ffmpeg" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Setting FFMPEG_DIR=$extractedDir"

          # Remove hwcontext_cuda.h to prevent bindgen failure with un-stubbed CUarray in FFmpeg master
          $cudaH = Join-Path $extractedDir "include\libavutil\hwcontext_cuda.h"
          if (Test-Path $cudaH) {
              Write-Host "Removing $cudaH to avoid CUDA SDK dependency in bindgen..."
              Remove-Item $cudaH -Force
          }

          echo "FFMPEG_DIR=$extractedDir" >> $env:GITHUB_ENV
          echo "$extractedDir\bin" >> $env:GITHUB_PATH

      - name: Cargo Check Windows Binary
        run: cargo check --bin nativis --target x86_64-pc-windows-msvc --features video

      - name: Cargo Test Windows Platform & Core
        run: cargo test -p nativis-platform-windows -p nativis-ipc -p nativis-core --target x86_64-pc-windows-msvc
