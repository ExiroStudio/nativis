name: CI Matrix (Linux & Windows)

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-ci

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            nasm \
            clang \
            libclang-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Cargo Test Workspace
        run: cargo test --workspace

  check-windows:
    name: Check & Test (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-ci

      - name: Cargo Check Windows Binary
        run: cargo check --bin nativis --target x86_64-pc-windows-msvc

      - name: Cargo Test Windows Platform & Core
        run: cargo test -p nativis-platform-windows -p nativis-ipc -p nativis-core --target x86_64-pc-windows-msvc
