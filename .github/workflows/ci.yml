name: CI Matrix (Linux & Windows)

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Format & Clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-lint

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            libclang-dev \
            libfontconfig1-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswresample-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  check-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-ci

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            nasm \
            clang \
            libclang-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswresample-dev

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Cargo Test Workspace
        run: cargo test --workspace

  check-windows:
    name: Check & Test (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-ci

      - name: Install FFmpeg Development Libraries (Windows MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pinned to a specific autobuild tag to prevent supply-chain drift.
          # To update: pick a new tag from https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases
          # and update both the URL and the expected SHA-256 below.
          $tag = "autobuild-2026-11-25-12-41"
          $filename = "ffmpeg-n9.0.2-963-g4d831360c9-win64-gpl-shared-9.0.zip"
          $url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$tag/$filename"
          # SHA-256 of the pinned zip (verify with: Get-FileHash ffmpeg.zip -Algorithm SHA256)
          # Update this whenever $tag is bumped.
          $expectedSha = "922B4CA843EE388F49898991EFFBFD5396C828E467C4738A05D3A908344EC529"
          Write-Host "Downloading FFmpeg $tag from $url..."
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
          $actualSha = (Get-FileHash "ffmpeg.zip" -Algorithm SHA256).Hash
          if ($expectedSha -ne "PLACEHOLDER_SHA256_UPDATE_WHEN_BUMPING_TAG" -and $actualSha -ne $expectedSha) {
              Write-Error "FFmpeg zip SHA-256 mismatch: expected $expectedSha got $actualSha"
              exit 1
          } elseif ($expectedSha -eq "PLACEHOLDER_SHA256_UPDATE_WHEN_BUMPING_TAG") {
              Write-Warning "FFmpeg SHA-256 not pinned yet — set expectedSha in ci.yml to: $actualSha"
          }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "C:\ffmpeg"
          $extractedDir = Get-ChildItem -Path "C:\ffmpeg" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Setting FFMPEG_DIR=$extractedDir"

          # Remove hwcontext_cuda.h to prevent bindgen failure with un-stubbed CUarray in FFmpeg master
          $cudaH = Join-Path $extractedDir "include\libavutil\hwcontext_cuda.h"
          if (Test-Path $cudaH) {
              Write-Host "Removing $cudaH to avoid CUDA SDK dependency in bindgen..."
              Remove-Item $cudaH -Force
          }

          echo "FFMPEG_DIR=$extractedDir" >> $env:GITHUB_ENV
          echo "$extractedDir\bin" >> $env:GITHUB_PATH

      - name: Cargo Check Windows Binary
        run: cargo check --bin nativis --target x86_64-pc-windows-msvc --features video

      - name: Cargo Test Windows Platform & Core
        run: cargo test -p nativis-platform-windows -p nativis-ipc -p nativis-core -p nativis-bootstrapper --target x86_64-pc-windows-msvc
