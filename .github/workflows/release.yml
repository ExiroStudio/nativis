name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: nativis-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: nativis-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: nativis-windows-amd64.exe
            vcpkg_triplet: 'x64-windows'
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: nativis-windows-x86.exe
            vcpkg_triplet: 'x86-windows'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Setup Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config qtdeclarative5-dev plasma-workspace-dev kpackagetool5 libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev libavdevice-dev clang
          


      - name: Build Engine (All)
        run: cargo build --release --bin nativis --target ${{ matrix.target }}
        
      - name: Build KDE Bundle (Linux Only)
        if: runner.os == 'Linux'
        run: cargo xtask bundle-kde

      - name: Prepare Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-artifacts
          cp target/${{ matrix.target }}/release/nativis release-artifacts/${{ matrix.artifact_name }}
          tar -czvf release-artifacts/kde-bundle.tar.gz -C platforms/kde-x11 .
          
      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release-artifacts
          copy target\${{ matrix.target }}\release\nativis.exe release-artifacts\${{ matrix.artifact_name }}
          


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-bundle
          path: release-artifacts/*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
