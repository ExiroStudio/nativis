name: Build and Release (Linux)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Single Binary (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-release

      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            nasm \
            clang \
            libclang-dev \
            qtbase5-dev \
            qtdeclarative5-dev \
            libqt5opengl5-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-shader-baker \
            qt6-shadertools-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev

      - name: Assemble Platform Bundles (KDE Plasma 5 & 6)
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          cargo run -p xtask -- bundle-all

      - name: Build Standalone Engine Binary
        env:
          FFMPEG_MARCH: x86-64
          FFMPEG_MTUNE: generic
        run: cargo build --release --bin nativis --target x86_64-unknown-linux-gnu --features nativis-plugin-video/bundle-ffmpeg

      - name: Prepare Single Binary Release Asset
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/nativis dist/nativis-linux-x86_64
          strip dist/nativis-linux-x86_64
          chmod +x dist/nativis-linux-x86_64

          # Also package complete tarball including desktop platform bundles (KDE Plasma 5 & 6)
          cp dist/nativis-linux-x86_64 nativis
          tar -czf dist/nativis-linux-x86_64.tar.gz nativis platforms/
          rm nativis

          # Compute SHA-256 checksums
          cd dist
          sha256sum nativis-linux-x86_64 > nativis-linux-x86_64.sha256
          sha256sum nativis-linux-x86_64.tar.gz > nativis-linux-x86_64.tar.gz.sha256
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nativis-linux-x86_64-binary
          path: dist/*
          retention-days: 7

  build-windows:
    name: Build Windows Single Binary (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-release

      - name: Install FFmpeg Development Libraries (Windows MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Write-Host "Downloading FFmpeg shared build from $url..."
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "C:\ffmpeg"
          $extractedDir = Get-ChildItem -Path "C:\ffmpeg" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Setting FFMPEG_DIR=$extractedDir"

          # Remove hwcontext_cuda.h to prevent bindgen failure with un-stubbed CUarray in FFmpeg master
          $cudaH = Join-Path $extractedDir "include\libavutil\hwcontext_cuda.h"
          if (Test-Path $cudaH) {
              Write-Host "Removing $cudaH to avoid CUDA SDK dependency in bindgen..."
              Remove-Item $cudaH -Force
          }

          echo "FFMPEG_DIR=$extractedDir" >> $env:GITHUB_ENV
          echo "$extractedDir\bin" >> $env:GITHUB_PATH

      - name: Build Standalone Windows Binary
        run: cargo build --release --bin nativis --target x86_64-pc-windows-msvc --features video

      - name: Prepare Single Binary Release Asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/nativis.exe dist/nativis-windows-x86_64.exe
          cp target/x86_64-pc-windows-msvc/release/nativis.exe dist/nativis.exe

          # Bundle FFmpeg runtime DLLs for portable execution
          cp "$FFMPEG_DIR"/bin/*.dll dist/

          cd dist
          # Package complete standalone zip archive with nativis.exe and all required DLLs
          7z a nativis-windows-x86_64.zip nativis.exe *.dll
          rm nativis.exe *.dll
          sha256sum nativis-windows-x86_64.exe > nativis-windows-x86_64.exe.sha256
          sha256sum nativis-windows-x86_64.zip > nativis-windows-x86_64.zip.sha256
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nativis-windows-x86_64-binary
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nativis-linux-x86_64-binary
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nativis-windows-x86_64-binary
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nativis-linux-x86_64
            dist/nativis-linux-x86_64.sha256
            dist/nativis-linux-x86_64.tar.gz
            dist/nativis-linux-x86_64.tar.gz.sha256
            dist/nativis-windows-x86_64.exe
            dist/nativis-windows-x86_64.exe.sha256
            dist/nativis-windows-x86_64.zip
            dist/nativis-windows-x86_64.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
