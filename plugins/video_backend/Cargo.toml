[package]
name = "nativis-plugin-video"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
bundle-ffmpeg = ["ffmpeg-next/build", "dep:ffmpeg-sys-next", "ffmpeg-sys-next/build-portable"]

[dependencies]
nativis-core  = { workspace = true }
nativis-asset = { workspace = true }

tracing   = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }

# Direct libav bindings (links system FFmpeg by default, or builds bundled static with feature 'bundle-ffmpeg')
ffmpeg-next = { version = "9", features = ["non-exhaustive-enums"] }
ffmpeg-sys-next = { version = "9", optional = true }
