[package]
name = "nativis-plugin-video"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
bundle-ffmpeg = ["ffmpeg-next/build"]

[dependencies]
nativis-core  = { workspace = true }
nativis-asset = { workspace = true }

tracing   = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }

# Direct libav bindings (links system FFmpeg by default, or builds bundled static with feature 'bundle-ffmpeg')
ffmpeg-next = { version = "9" }
